  <script>
    window.addEventListener('load', () => {
      const audio = new Audio('bgm.mp3');
      audio.loop = true;
      audio.play().catch(err => {
        console.log('Autoplay prevented:', err);
        const playOnInteraction = () => {
          audio.play();
          document.removeEventListener('click', playOnInteraction);
          document.removeEventListener('keydown', playOnInteraction);
        };
        document.addEventListener('click', playOnInteraction);
        document.addEventListener('keydown', playOnInteraction);
      });
    });
    
    let mouseX = 0;
    let mouseY = 0;
    let currentX = 0;
    let currentY = 0;
    
    document.addEventListener('mousemove', (e) => {
      mouseX = (e.clientX / window.innerWidth - 0.5) * 30;
      mouseY = (e.clientY / window.innerHeight - 0.5) * 30;
    });
    
    function animate() {
      currentX += (mouseX - currentX) * 0.1;
      currentY += (mouseY - currentY) * 0.1;
      
      const bgContainer = document.getElementById('bg-container');
      const contentContainer = document.getElementById('content-container');
      
      if (bgContainer) {
        bgContainer.style.transform = `scale(1.03) translate(${currentX * -0.5}px, ${currentY * -0.5}px)`;
      }
      
      if (contentContainer) {
        contentContainer.style.transform = `translate(${currentX * -1}px, ${currentY * -1}px)`;
      }
      
      requestAnimationFrame(animate);
    }
    
    animate();
    
    const links = document.querySelectorAll('a');
    links.forEach(link => {
      const icon = link.querySelector('.text-white\\/40');
      const arrow = link.querySelector('.hover-arrow');
      
      link.addEventListener('mouseenter', () => {
        link.style.borderColor = 'rgba(255, 255, 255, 0.2)';
        link.style.backgroundColor = 'rgba(255, 255, 255, 0.1)';
        if (icon) icon.style.color = 'rgba(255, 255, 255, 0.6)';
        if (arrow) {
          arrow.style.color = 'rgba(255, 255, 255, 0.6)';
          arrow.style.transform = 'translate(0.25rem, -0.25rem)';
        }
      });
      
      link.addEventListener('mouseleave', () => {
        link.style.borderColor = 'rgba(255, 255, 255, 0.1)';
        link.style.backgroundColor = 'rgba(255, 255, 255, 0.05)';
        if (icon) icon.style.color = 'rgba(255, 255, 255, 0.4)';
        if (arrow) {
          arrow.style.color = 'rgba(255, 255, 255, 0.3)';
          arrow.style.transform = 'translate(0, 0)';
        }
      });
    });
  </script>
