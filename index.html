<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>aterally</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      margin: 0;
      padding: 0;
    }
    
    a {
      text-decoration: none;
      color: inherit;
    }
    
    ::selection {
      background-color: white;
      color: black;
    }
    
    ::-moz-selection {
      background-color: white;
      color: black;
    }
    
    .container {
      min-height: 100vh;
      position: relative;
      overflow: hidden;
      user-select: none;
    }
    
    .bg-fixed {
      position: fixed;
      top: 0;
      right: 0;
      bottom: 0;
      left: 0;
      z-index: 0;
    }
    
    .bg-inner {
      width: 100%;
      height: 100%;
      transition: transform 300ms cubic-bezier(0, 0, 0.2, 1);
    }
    
    .bg-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    
    .bg-overlay {
      position: absolute;
      top: 0;
      right: 0;
      bottom: 0;
      left: 0;
      background-color: rgba(0, 0, 0, 0.7);
    }
    
    .bg-noise {
      position: absolute;
      top: 0;
      right: 0;
      bottom: 0;
      left: 0;
      opacity: 0.1;
      mix-blend-mode: overlay;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
    }
    
    .content {
      position: relative;
      z-index: 10;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 4rem 1.5rem;
      transition: transform 300ms cubic-bezier(0, 0, 0.2, 1);
    }
    
    .hero {
      flex: 1 1 0%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      max-width: 48rem;
    }
    
    .welcome {
      color: rgba(255, 255, 255, 0.4);
      font-size: 0.75rem;
      line-height: 1rem;
      letter-spacing: 0.3em;
      text-transform: lowercase;
      margin-bottom: 2rem;
      height: 1rem;
      display: flex;
      align-items: center;
    }
    
    .title {
      font-size: 3rem;
      line-height: 1;
      font-family: ui-serif, Georgia, Cambria, 'Times New Roman', Times, serif;
      color: white;
      margin-bottom: 1.5rem;
      text-transform: lowercase;
      letter-spacing: 0.025em;
    }
    
    .subtitle {
      color: rgba(255, 255, 255, 0.5);
      letter-spacing: 0.2em;
      font-size: 0.875rem;
      line-height: 1.25rem;
      margin-bottom: 2rem;
    }
    
    .tagline {
      color: rgba(255, 255, 255, 0.6);
      font-size: 1rem;
      line-height: 1.625;
      max-width: 36rem;
    }
    
    .links-section {
      width: 100%;
      max-width: 42rem;
    }
    
    .links-container {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }
    
    .link-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1.25rem 1.75rem;
      border-radius: 9999px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background-color: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(12px);
      transition: all 500ms cubic-bezier(0, 0, 0.2, 1);
    }
    
    .link-content {
      display: flex;
      align-items: center;
      gap: 1rem;
    }
    
    .link-icon {
      width: 1rem;
      height: 1rem;
      color: rgba(255, 255, 255, 0.4);
      transition: color 500ms;
    }
    
    .link-title {
      color: rgba(255, 255, 255, 0.9);
      font-weight: 300;
      letter-spacing: 0.05em;
      font-size: 1rem;
      line-height: 1.5rem;
    }
    
    .link-desc {
      color: rgba(255, 255, 255, 0.4);
      font-size: 0.75rem;
      line-height: 1rem;
    }
    
    .link-arrow {
      width: 1rem;
      height: 1rem;
      color: rgba(255, 255, 255, 0.3);
      transition: all 500ms cubic-bezier(0, 0, 0.2, 1);
    }
    
    .footer {
      margin-top: 4rem;
      text-align: center;
    }
    
    .footer-text {
      color: rgba(255, 255, 255, 0.2);
      font-size: 0.75rem;
      line-height: 1rem;
    }
    
    @media (min-width: 768px) {
      .title {
        font-size: 4.5rem;
      }
      
      .tagline {
        font-size: 1.125rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="bg-fixed">
      <div id="bg-container" class="bg-inner">
        <img src="https://i.ibb.co/hFhwm4Sk/bg.jpg" alt="Background" class="bg-img">
      </div>
      <div class="bg-overlay"></div>
      <div class="bg-noise"></div>
    </div>
    
    <div id="content-container" class="content">
      <div class="hero">
        <div class="welcome">
          <span id="welcome-text">welcome...</span>
        </div>
        <h1 class="title">aterally</h1>
        <p class="subtitle">@?!</p>
        <p class="tagline">solve et coagula</p>
      </div>
      
      <div class="links-section">
        <div class="links-container">
          <a href="https://tinyurl.com/Y2hlc3M" target="_blank" rel="noopener noreferrer" class="link-item">
            <div class="link-content">
              <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="link-icon">
                <path d="M11.562 3.266a.5.5 0 0 1 .876 0L15.39 8.87a1 1 0 0 0 1.516.294L21.183 5.5a.5.5 0 0 1 .798.519l-2.834 10.246a1 1 0 0 1-.956.734H5.81a1 1 0 0 1-.957-.734L2.02 6.02a.5.5 0 0 1 .798-.519l4.276 3.664a1 1 0 0 0 1.516-.294z"></path>
                <path d="M5 21h14"></path>
              </svg>
              <div>
                <h3 class="link-title">chess</h3>
                <p class="link-desc">i don't accept friend requests</p>
              </div>
            </div>
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="link-arrow">
              <path d="M7 7h10v10"></path>
              <path d="M7 17 17 7"></path>
            </svg>
          </a>
          
          <a href="#" target="_blank" rel="noopener noreferrer" class="link-item">
            <div class="link-content">
              <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="link-icon">
                <path d="M11.767 19.089c4.924.868 6.14-6.025 1.216-6.894m-1.216 6.894L5.86 18.047m5.908 1.042-.347 1.97m1.563-8.864c4.924.869 6.14-6.025 1.215-6.893m-1.215 6.893-3.94-.694m5.155-6.2L8.29 4.26m5.908 1.042.348-1.97M7.48 20.364l3.126-17.727"></path>
              </svg>
              <div>
                <h3 class="link-title">bitcoin</h3>
                <p class="link-desc">bc1qg406ewv3znyccanrw2p3t3wnypape5w3afwgx6</p>
              </div>
            </div>
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="link-arrow">
              <path d="M7 7h10v10"></path>
              <path d="M7 17 17 7"></path>
            </svg>
          </a>
          
          <a href="https://tinyurl.com/c3VjaCBhIHNrZXB0aWM" target="_blank" rel="noopener noreferrer" class="link-item">
            <div class="link-content">
              <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="link-icon">
                <circle cx="12" cy="12" r="10"></circle>
                <path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"></path>
                <path d="M2 12h20"></path>
              </svg>
              <div>
                <h3 class="link-title">others</h3>
                <p class="link-desc">more links</p>
              </div>
            </div>
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="link-arrow">
              <path d="M7 7h10v10"></path>
              <path d="M7 17 17 7"></path>
            </svg>
          </a>
        </div>
        
        <div class="footer">
          <p class="footer-text">© 2026 • you thought</p>
        </div>
      </div>
    </div>
  </div>
  
  <script>
    fetch('https://api.ipify.org?format=json')
      .then(response => response.json())
      .then(data => {
        const welcomeText = document.getElementById('welcome-text');
        if (welcomeText && data.ip) {
          welcomeText.textContent = `welcome  ${data.ip}`;
        }
      })
      .catch(err => {
        console.log('Could not fetch IP:', err);
      });
    
    window.addEventListener('load', () => {
      const audio = new Audio('bgm.mp3');
      audio.loop = true;
      audio.play().catch(err => {
        console.log('Autoplay prevented:', err);
        const playOnInteraction = () => {
          audio.play();
          document.removeEventListener('click', playOnInteraction);
          document.removeEventListener('keydown', playOnInteraction);
        };
        document.addEventListener('click', playOnInteraction);
        document.addEventListener('keydown', playOnInteraction);
      });
    });
    
    let mouseX = 0;
    let mouseY = 0;
    let currentX = 0;
    let currentY = 0;
    
    document.addEventListener('mousemove', (e) => {
      mouseX = (e.clientX / window.innerWidth - 0.5) * 30;
      mouseY = (e.clientY / window.innerHeight - 0.5) * 30;
    });
    
    function animate() {
      currentX += (mouseX - currentX) * 0.1;
      currentY += (mouseY - currentY) * 0.1;
      
      const bgContainer = document.getElementById('bg-container');
      const contentContainer = document.getElementById('content-container');
      
      if (bgContainer) {
        bgContainer.style.transform = `scale(1.03) translate(${currentX * -0.5}px, ${currentY * -0.5}px)`;
      }
      
      if (contentContainer) {
        contentContainer.style.transform = `translate(${currentX * -1}px, ${currentY * -1}px)`;
      }
      
      requestAnimationFrame(animate);
    }
    
    animate();
    
    const links = document.querySelectorAll('.link-item');
    links.forEach(link => {
      const icon = link.querySelector('.link-icon');
      const arrow = link.querySelector('.link-arrow');
      
      link.addEventListener('mouseenter', () => {
        link.style.borderColor = 'rgba(255, 255, 255, 0.2)';
        link.style.backgroundColor = 'rgba(255, 255, 255, 0.1)';
        if (icon) icon.style.color = 'rgba(255, 255, 255, 0.6)';
        if (arrow) {
          arrow.style.color = 'rgba(255, 255, 255, 0.6)';
          arrow.style.transform = 'translate(0.25rem, -0.25rem)';
        }
      });
      
      link.addEventListener('mouseleave', () => {
        link.style.borderColor = 'rgba(255, 255, 255, 0.1)';
        link.style.backgroundColor = 'rgba(255, 255, 255, 0.05)';
        if (icon) icon.style.color = 'rgba(255, 255, 255, 0.4)';
        if (arrow) {
          arrow.style.color = 'rgba(255, 255, 255, 0.3)';
          arrow.style.transform = 'translate(0, 0)';
        }
      });
    });
  </script>
</body>
</html>
